[project]
name = "roge"
version = "0.1.0"
description = "ROGE (RObustness GEnetic): learning STL classifiers from data (Nenzi et al., QEST 2018)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["signal temporal logic", "specification mining", "genetic algorithm", "GP-UCB"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roge"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
